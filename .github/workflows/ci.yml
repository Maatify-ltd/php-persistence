name: WU-13 Published RC Evidence

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  consumer-verification:
    name: Consumer verification and coexistence
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      # actions/checkout v7.0.1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-php-composer
        with:
          php-version: "8.4"
      - name: Fetch and verify the published tag
        run: |
          set -euo pipefail
          git fetch origin tag v1.0.0-rc.1
          test "$(git rev-parse 'refs/tags/v1.0.0-rc.1^{commit}')" = 34c3b874525d36ae064c162cdd553bc75d18772b
      - name: Install and verify the Packagist RC twice on fresh MySQL
        run: composer test:consumer
      - name: No Compose resources remain
        if: always()
        run: |
          set -euo pipefail
          test -z "$(docker ps -aq --filter 'label=com.docker.compose.project')"
          test -z "$(docker volume ls -q --filter 'label=com.docker.compose.project')"
