name: Set up PHP and Composer
description: >-
  Installs the requested PHP minor (8.4, 8.5 or 8.6) with pdo_mysql, pcntl and posix, proves that
  the CLI is a real stable build that meets the applicable security patch floor, and installs Composer 2.10.3
  (pinned version, SHA-256 verified). Composer 2.10 is the first release with the
  dependency-policy model (config.policy) required by the pinned CI Workflow Standard.
inputs:
  php-version:
    description: PHP minor to install (8.4, 8.5 or 8.6)
    required: true
runs:
  using: composite
  steps:
    # Two pins on purpose (least change). 8.4 and 8.5 stay on the qualified setup-php 2.40.0 release.
    # 2.40.0 installs `8.6` as a PHP 8.6.0-dev nightly (its unix.sh nightly_versions is 8.[6-9]), so 8.6 alone uses
    # shivammathur/setup-php main@2001cd31, which is 43 commits ahead of 2.40.0 (nightly_versions 8.[7-9], PHP 8.6
    # marked stable, an ES-module rebuild of the bundled action, and changed Linux apt and download helpers).
    # Review condition: when a tagged setup-php release that contains 2001cd31 exists, move every minor to
    # that release's full commit SHA and delete this split. The next step proves the PHP build either way.
    - name: Set up PHP ${{ inputs.php-version }}
      if: inputs.php-version != '8.6'
      # shivammathur/setup-php 2.40.0
      uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962
      with:
        php-version: ${{ inputs.php-version }}
        extensions: pdo, pdo_mysql, mbstring, tokenizer, ctype, json, pcntl, posix
        tools: none
        coverage: none
        ini-values: error_reporting=-1, display_errors=On
    - name: Set up PHP ${{ inputs.php-version }} (stable 8.6 build)
      if: inputs.php-version == '8.6'
      # shivammathur/setup-php main@2001cd3148dcbaf467b7fa06cd7155ebb6d4cacf (untagged; see the comment above)
      uses: shivammathur/setup-php@2001cd3148dcbaf467b7fa06cd7155ebb6d4cacf
      with:
        php-version: ${{ inputs.php-version }}
        extensions: pdo, pdo_mysql, mbstring, tokenizer, ctype, json, pcntl, posix
        tools: none
        coverage: none
        ini-values: error_reporting=-1, display_errors=On
    - name: Prove the native stable PHP CLI and security patch floor
      shell: bash
      env:
        PHP_MINOR: ${{ inputs.php-version }}
      run: |
        set -euo pipefail
        actual="$(php -r 'echo PHP_VERSION;')"
        version_id="$(php -r 'echo PHP_VERSION_ID;')"
        echo "PHP_VERSION=$actual PHP_VERSION_ID=$version_id SAPI=$(php -r 'echo PHP_SAPI;') ZTS=$(php -r 'echo PHP_ZTS;') machine=$(uname -m)"
        case "$actual" in
          "$PHP_MINOR".[0-9]|"$PHP_MINOR".[0-9][0-9]) ;;
          *) echo "PHP $actual is not a stable release of the requested minor $PHP_MINOR" >&2; exit 1 ;;
        esac
        if [[ ! "$version_id" =~ ^[0-9]{5}$ ]]; then
          echo "Cannot verify the patch level for PHP $actual: invalid PHP_VERSION_ID" >&2
          exit 1
        fi
        case "$PHP_MINOR" in
          8.4) floor=80427 ;;
          8.5) floor=80512 ;;
          *) floor= ;;
        esac
        if [[ -n "$floor" ]] && (( 10#$version_id < floor )); then
          echo "PHP $actual is below the security patch floor for $PHP_MINOR (PHP_VERSION_ID >= $floor)" >&2
          exit 1
        fi
        test "$(php -r 'echo PHP_SAPI;')" = cli
        test "$(uname -m)" = x86_64
        loaded="$(php -m)"
        for extension in PDO pdo_mysql pcntl posix; do
          printf '%s\n' "$loaded" | grep -x "$extension" > /dev/null || { echo "extension $extension is not loaded" >&2; exit 1; }
        done
    - name: Install Composer 2.10.3 (pinned, checksum verified)
      shell: bash
      env:
        COMPOSER_VERSION: 2.10.3
        COMPOSER_SHA256: 7a2d379d5b8ffdaa028580ef26494c36d2feef4b178d3dd1473a4dbc5e17c8d6
      run: |
        set -euo pipefail
        mkdir -p "$RUNNER_TEMP/composer-bin"
        curl --fail --silent --show-error --location \
          --output "$RUNNER_TEMP/composer.phar" \
          "https://getcomposer.org/download/${COMPOSER_VERSION}/composer.phar"
        echo "${COMPOSER_SHA256}  $RUNNER_TEMP/composer.phar" | sha256sum --check --strict -
        install -m 0755 "$RUNNER_TEMP/composer.phar" "$RUNNER_TEMP/composer-bin/composer"
        echo "$RUNNER_TEMP/composer-bin" >> "$GITHUB_PATH"
        "$RUNNER_TEMP/composer-bin/composer" --version | tee /dev/stderr | grep -F "Composer version ${COMPOSER_VERSION}"
    - name: Report the toolchain
      shell: bash
      run: |
        set -euo pipefail
        php --version
        php -m | grep -E '^(PDO|pdo_mysql|pcntl|posix)$'
        composer --version
