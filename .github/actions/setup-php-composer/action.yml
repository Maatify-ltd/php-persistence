name: Set up PHP and Composer
description: >-
  Installs the requested PHP minor (8.4, 8.5 or 8.6) with pdo_mysql, pcntl and posix, proves that
  the CLI is a real stable build of that minor, and installs a deterministic Composer 2.10.3
  (pinned version, SHA-256 verified). Composer 2.10 is the first release with the
  dependency-policy model (config.policy) required by the pinned CI Workflow Standard.
inputs:
  php-version:
    description: PHP minor to install (8.4, 8.5 or 8.6)
    required: true
runs:
  using: composite
  steps:
    - name: Set up PHP ${{ inputs.php-version }}
      # shivammathur/setup-php main@2001cd3148dcbaf467b7fa06cd7155ebb6d4cacf ("Mark PHP 8.6 as stable").
      # The pinned 2.40.0 release (eb7c497e) installs `8.6` as a PHP 8.6.0-dev nightly, so it cannot qualify
      # the stable minor; there is no tagged release after 2.40.0 yet. The next step proves the build.
      uses: shivammathur/setup-php@2001cd3148dcbaf467b7fa06cd7155ebb6d4cacf
      with:
        php-version: ${{ inputs.php-version }}
        extensions: pdo, pdo_mysql, mbstring, tokenizer, ctype, json, pcntl, posix
        tools: none
        coverage: none
        ini-values: error_reporting=-1, display_errors=On
    - name: Prove a native stable PHP CLI of the requested minor
      shell: bash
      env:
        PHP_MINOR: ${{ inputs.php-version }}
      run: |
        set -euo pipefail
        actual="$(php -r 'echo PHP_VERSION;')"
        echo "PHP_VERSION=$actual SAPI=$(php -r 'echo PHP_SAPI;') ZTS=$(php -r 'echo PHP_ZTS;') machine=$(uname -m)"
        case "$actual" in
          "$PHP_MINOR".[0-9]|"$PHP_MINOR".[0-9][0-9]) ;;
          *) echo "PHP $actual is not a stable release of the requested minor $PHP_MINOR" >&2; exit 1 ;;
        esac
        test "$(php -r 'echo PHP_SAPI;')" = cli
        test "$(uname -m)" = x86_64
        loaded="$(php -m)"
        for extension in PDO pdo_mysql pcntl posix; do
          printf '%s\n' "$loaded" | grep -x "$extension" > /dev/null || { echo "extension $extension is not loaded" >&2; exit 1; }
        done
    - name: Install Composer 2.10.3 (pinned, checksum verified)
      shell: bash
      env:
        COMPOSER_VERSION: 2.10.3
        COMPOSER_SHA256: 7a2d379d5b8ffdaa028580ef26494c36d2feef4b178d3dd1473a4dbc5e17c8d6
      run: |
        set -euo pipefail
        mkdir -p "$RUNNER_TEMP/composer-bin"
        curl --fail --silent --show-error --location \
          --output "$RUNNER_TEMP/composer.phar" \
          "https://getcomposer.org/download/${COMPOSER_VERSION}/composer.phar"
        echo "${COMPOSER_SHA256}  $RUNNER_TEMP/composer.phar" | sha256sum --check --strict -
        install -m 0755 "$RUNNER_TEMP/composer.phar" "$RUNNER_TEMP/composer-bin/composer"
        echo "$RUNNER_TEMP/composer-bin" >> "$GITHUB_PATH"
        "$RUNNER_TEMP/composer-bin/composer" --version | tee /dev/stderr | grep -F "Composer version ${COMPOSER_VERSION}"
    - name: Report the toolchain
      shell: bash
      run: |
        set -euo pipefail
        php --version
        php -m | grep -E '^(PDO|pdo_mysql|pcntl|posix)$'
        composer --version
